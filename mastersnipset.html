<!-- ==========================================
     IMERSGATE: CHECKOUT SCRIPT (Taruh sebelum </body>) 
     Pastikan Anda sudah meload Tailwind CSS di head landing page ini!
=========================================== -->

<!-- Modal Popup Container -->
<div id="ig-checkout-modal" class="fixed inset-0 z-[9999] hidden flex items-center justify-center bg-black/80 backdrop-blur-sm p-4 font-sans opacity-0 transition-opacity duration-300">
    <div class="bg-[#1A1A1A] w-full max-w-md rounded-2xl shadow-2xl border border-[#2A2A2A] overflow-hidden transform scale-95 transition-transform duration-300" id="ig-modal-content">
        
        <!-- Header -->
        <div class="bg-[#222] px-6 py-4 border-b border-[#2A2A2A] flex justify-between items-center relative overflow-hidden">
            <div class="absolute top-0 right-0 w-24 h-24 bg-[#FF6A00]/10 rounded-bl-full -mr-4 -mt-4 z-0"></div>
            
            <div class="flex items-center relative z-10 w-full justify-between pr-4">
                <h3 class="text-lg font-bold text-white flex items-center">
                    <svg class="w-5 h-5 mr-2 text-[#FF6A00]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
                    Checkout
                </h3>
                
                <!-- IDENTITAS AGENCY (Akan diisi via JS) -->
                <div id="ig-agency-badge" class="hidden text-right">
                    <p class="text-[10px] text-gray-500 uppercase tracking-wider mb-0.5">Penjual Resmi</p>
                    <p id="ig-agency-name" class="text-sm font-semibold text-[#FF6A00] truncate max-w-[120px]">Memuat...</p>
                </div>
            </div>

            <button id="ig-close-btn" class="text-gray-400 hover:text-white relative z-10 ml-2">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
        </div>

        <!-- Body -->
        <div class="p-6">
            
            <!-- Skeleton Loader (Muncul saat narik data API) -->
            <div id="ig-loader" class="flex flex-col items-center justify-center py-10">
                <div class="w-10 h-10 border-4 border-[#2A2A2A] border-t-[#FF6A00] rounded-full animate-spin mb-4"></div>
                <p class="text-gray-400 text-sm">Menyiapkan pembayaran...</p>
            </div>

            <!-- Form Konten Utama -->
            <div id="ig-main-content" class="hidden">
                <!-- Ringkasan Produk -->
                <div class="mb-6 p-4 bg-black rounded-xl border border-[#2A2A2A]">
                    <p class="text-xs text-gray-500 font-mono mb-1">PRODUK</p>
                    <h4 id="ig-prod-name" class="text-lg font-bold text-white leading-tight">Nama Produk</h4>
                    <div class="mt-3 flex justify-between items-center border-t border-[#333] pt-3">
                        <span class="text-sm text-gray-400">Total Tagihan</span>
                        <span id="ig-prod-price" class="text-xl font-bold text-[#FF6A00]">Rp 0</span>
                    </div>
                </div>

                <form id="ig-form-order" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-300 mb-1">Nama Lengkap</label>
                        <input type="text" id="ig-input-name" required class="w-full px-4 py-2.5 bg-black border border-[#2A2A2A] text-white rounded-lg focus:ring-2 focus:ring-[#FF6A00] focus:border-[#FF6A00] outline-none transition-all placeholder-gray-600" placeholder="Cth: Budi Santoso">
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-300 mb-1">No. WhatsApp</label>
                            <input type="number" id="ig-input-wa" required class="w-full px-4 py-2.5 bg-black border border-[#2A2A2A] text-white rounded-lg focus:ring-2 focus:ring-[#FF6A00] focus:border-[#FF6A00] outline-none transition-all placeholder-gray-600" placeholder="0812...">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-300 mb-1">Email Aktif</label>
                            <input type="email" id="ig-input-email" required class="w-full px-4 py-2.5 bg-black border border-[#2A2A2A] text-white rounded-lg focus:ring-2 focus:ring-[#FF6A00] focus:border-[#FF6A00] outline-none transition-all placeholder-gray-600" placeholder="budi@gmail.com">
                        </div>
                    </div>

                    <!-- Area Info Pembayaran -->
                    <div class="mt-6 pt-6 border-t border-[#2A2A2A]">
                        <h4 class="text-sm font-bold text-white mb-3">Tujuan Transfer</h4>
                        
                        <!-- Image QRIS (Hidden by default) -->
                        <div id="ig-qris-container" class="hidden mb-4 p-2 bg-white rounded-xl mx-auto w-48 h-48 border-4 border-[#FF6A00]">
                            <img id="ig-qris-img" src="" alt="QRIS" class="w-full h-full object-cover rounded-lg">
                        </div>
                        
                        <div class="bg-[#222] p-4 rounded-xl border border-[#2A2A2A] flex items-center">
                            <div class="w-10 h-10 rounded-full bg-[#FF6A00]/10 flex items-center justify-center mr-3 flex-shrink-0">
                                <svg class="w-5 h-5 text-[#FF6A00]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z"></path></svg>
                            </div>
                            <div>
                                <p id="ig-bank-details" class="text-lg font-bold text-white tracking-wide">BCA 1234567</p>
                                <p id="ig-bank-owner" class="text-xs text-gray-400 mt-0.5 uppercase">A.N BUNDA</p>
                            </div>
                        </div>
                    </div>

                    <button type="submit" class="w-full bg-[#FF6A00] hover:bg-[#E65C00] text-white py-3.5 rounded-xl font-bold mt-6 shadow-lg shadow-[#FF6A00]/30 transition-all flex items-center justify-center">
                        Kirim Pesanan ke WA <svg class="w-4 h-4 ml-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                    </button>
                </form>
            </div>
            
            <!-- Error State -->
            <div id="ig-error-state" class="hidden flex flex-col items-center justify-center py-8 text-center">
                <svg class="w-12 h-12 text-red-500 mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                <h4 class="text-white font-bold mb-1">Gagal Memuat</h4>
                <p class="text-gray-400 text-sm">Pastikan link promosi yang Anda gunakan benar.</p>
            </div>

        </div>
    </div>
</div>

<script>
    // ⚠️ GANTI DENGAN URL APPS SCRIPT ANDA SENDIRI
    const API_URL = 'https://script.google.com/macros/s/AKfycbxaG9u14IqeA7DOw1rlyoCUeK8t_XzOTyTRqWsgjiPcREVxIH7K8jeqgfA-RgAZ7hSVTg/exec';
    
    let currentAgencyData = null;
    let selectedProduct = "";
    let selectedPrice = "";

    document.addEventListener("DOMContentLoaded", () => {
        const modal = document.getElementById('ig-checkout-modal');
        const modalContent = document.getElementById('ig-modal-content');
        
        // Ambil ID Agency dari URL (contoh: ?ref=AGN-123)
        const urlParams = new URLSearchParams(window.location.search);
        const refId = urlParams.get('ref');

        // Cari semua tombol dengan class .btn-checkout di Landing Page lu
        const buttons = document.querySelectorAll('.btn-checkout');
        
        buttons.forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.preventDefault();
                // Tarik data nama produk dan harga dari attribute tombol
                selectedProduct = btn.getAttribute('data-product') || 'Produk Digital';
                selectedPrice = btn.getAttribute('data-price') || '0';
                
                document.getElementById('ig-prod-name').innerText = selectedProduct;
                document.getElementById('ig-prod-price').innerText = 'Rp ' + Number(selectedPrice).toLocaleString('id-ID');
                
                openModal();
                fetchAgencyInfo(refId);
            });
        });

        document.getElementById('ig-close-btn').addEventListener('click', closeModal);
        
        // Form Submit Handler
        document.getElementById('ig-form-order').addEventListener('submit', (e) => {
            e.preventDefault();
            if(!currentAgencyData) return alert('Data agency belum dimuat!');

            const name = document.getElementById('ig-input-name').value;
            const wa = document.getElementById('ig-input-wa').value;
            const email = document.getElementById('ig-input-email').value;

            // Format Nomor WA Agency ke 62
            let phoneTarget = String(currentAgencyData.phone).replace(/\D/g, '');
            if (phoneTarget.startsWith('0')) phoneTarget = '62' + phoneTarget.substring(1);
            if (phoneTarget.startsWith('8')) phoneTarget = '62' + phoneTarget;

            // Teks Pesanan
            let msg = `Halo kak ${currentAgencyData.agencyName}, saya mau order:\n\n`;
            msg += `📦 *Produk:* ${selectedProduct}\n`;
            msg += `💰 *Harga:* Rp ${Number(selectedPrice).toLocaleString('id-ID')}\n\n`;
            msg += `👤 *Data Saya:*\nNama: ${name}\nWA: ${wa}\nEmail: ${email}\n\n`;
            
            let bankInfo = currentAgencyData.bankName ? `${currentAgencyData.bankName} ${currentAgencyData.bankAccount}` : 'Bank Transfer';
            msg += `Saya akan transfer ke rekening *${bankInfo}*. Mohon diproses ya kak!`;

            // Lempar ke WhatsApp Web/App
            window.location.href = `https://wa.me/${phoneTarget}?text=${encodeURIComponent(msg)}`;
        });

        function openModal() {
            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                modalContent.classList.remove('scale-95');
            }, 10);
        }

        function closeModal() {
            modal.classList.add('opacity-0');
            modalContent.classList.add('scale-95');
            setTimeout(() => { modal.classList.add('hidden'); }, 300);
        }

        async function fetchAgencyInfo(agencyId) {
            // Reset Views
            document.getElementById('ig-loader').classList.remove('hidden');
            document.getElementById('ig-main-content').classList.add('hidden');
            document.getElementById('ig-error-state').classList.add('hidden');
            document.getElementById('ig-qris-container').classList.add('hidden');
            document.getElementById('ig-agency-badge').classList.add('hidden');

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: 'getCheckoutInfo', payload: { agencyId: agencyId || '' } })
                });
                
                const result = await response.json();
                if (!result.success) throw new Error(result.error);
                
                currentAgencyData = result.data;

                // Tampilkan Identitas Penjual Resmi (Agency)
                document.getElementById('ig-agency-name').innerText = currentAgencyData.agencyName;
                document.getElementById('ig-agency-badge').classList.remove('hidden');

                // Tampilkan Data Rekening
                const bankText = currentAgencyData.bankName ? `${currentAgencyData.bankName} ${currentAgencyData.bankAccount}` : 'Bank Transfer';
                const ownerText = currentAgencyData.bankOwner ? `A.N ${currentAgencyData.bankOwner}` : `A.N ${currentAgencyData.agencyName}`;
                
                document.getElementById('ig-bank-details').innerText = bankText;
                document.getElementById('ig-bank-owner').innerText = ownerText.toUpperCase();

                // Tampilkan QRIS Jika Ada
                if (currentAgencyData.qrisUrl && currentAgencyData.qrisUrl.length > 5) {
                    document.getElementById('ig-qris-img').src = currentAgencyData.qrisUrl;
                    document.getElementById('ig-qris-container').classList.remove('hidden');
                }

                // Show Content
                document.getElementById('ig-loader').classList.add('hidden');
                document.getElementById('ig-main-content').classList.remove('hidden');

            } catch (error) {
                document.getElementById('ig-loader').classList.add('hidden');
                document.getElementById('ig-error-state').classList.remove('hidden');
            }
        }
    });
</script>
